name = "parley"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws"]

[[d1_databases]]
binding = "DB"
database_name = "parley"
database_id = "6d914a5c-7dd3-4845-b874-2d15cd9ed915"
migrations_dir = "migrations"

[[d1_databases]]
binding = "BLOB1"
database_name = "parley-blob1"
database_id = "4bdd5069-a634-4e77-a243-885d10bd5ed9"

[[d1_databases]]
binding = "BLOB2"
database_name = "parley-blob2"
database_id = "4b876104-a1a2-4a57-9283-438b0f4f0336"

[[d1_databases]]
binding = "BLOB3"
database_name = "parley-blob3"
database_id = "95536c20-0188-4252-b273-5f500d17c323"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[triggers]
crons = ["* * * * *"]

[vars]
MAX_UPLOAD_MB = "25"
MAX_FILE_MB = "25"
USER_QUOTA_MB = "100"
PBKDF2_ITERS = "100000"
REGISTRATION_OPEN = "true"
ADMIN_USERNAMES = ""

[ai]
binding = "AI"

[version_metadata]
binding = "CF_VERSION_METADATA"
