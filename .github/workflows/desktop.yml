name: desktop
on:
  workflow_dispatch:
  push:
    paths:
      - desktop/**
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: desktop
      - run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            desktop/dist/Parley-Setup.exe
            desktop/dist/Parley.dmg
            desktop/dist/Parley.AppImage
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Parley apps
          files: out/*
