name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
    branches: [main]
    paths:
      - '.github/workflows/apps.yml'
      - 'public/logo-512.png'
permissions:
  contents: write
env:
  SITE: https://parley.heavengtwashere.workers.dev
  FEED: https://github.com/ScratchyGH/parley/releases/download/apps
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          rm -rf desktop && mkdir desktop && cd desktop
          mkdir build
          cp ../public/logo-512.png build/icon.png
          cat > package.json <<EOF
          {"name":"parley-desktop","version":"1.${{ github.run_number }}.0","description":"Parley desktop app","author":"Parley <parley@example.com>","homepage":"${SITE}","main":"main.js","build":{"appId":"app.parley.desktop","productName":"Parley","directories":{"buildResources":"build"},"files":["main.js","picker.js","package.json"],"publish":[{"provider":"generic","url":"${FEED}"}],"win":{"target":["nsis","portable"],"icon":"build/icon.png"},"portable":{"artifactName":"Parley-Portable.exe"},"nsis":{"oneClick":true,"perMachine":false,"runAfterFinish":true,"deleteAppDataOnUninstall":false,"artifactName":"Parley-Setup.exe"},"mac":{"target":["dmg","zip"],"icon":"build/icon.png","category":"public.app-category.social-networking","identity":null,"artifactName":"Parley.\${ext}"},"linux":{"target":["AppImage","deb"],"icon":"build/icon.png","category":"Network","executableArgs":["--no-sandbox"],"artifactName":"Parley.\${ext}"}}}
          EOF
          cat > picker.js <<'EOF'
          const{contextBridge,ipcRenderer}=require('electron')
          contextBridge.exposeInMainWorld('pickApi',{pick:id=>ipcRenderer.send('pick-source',id),onSources:f=>ipcRenderer.on('sources',(e,l)=>f(l))})
          EOF
          cat > main.js <<'EOF'
          const{app,BrowserWindow,shell,session,dialog,desktopCapturer,ipcMain}=require('electron')
          const{autoUpdater}=require('electron-updater')
          const SITE=process.env.PARLEY_SITE||'__SITE__'
          let win,cache=[],cacheAt=0,busy=false
          const grab=()=>desktopCapturer.getSources({types:['screen','window'],thumbnailSize:{width:320,height:200},fetchWindowIcons:false}).then(r=>{cache=r;cacheAt=Date.now();return r})
          const refresh=()=>{if(busy)return;busy=true;grab().catch(()=>{}).finally(()=>{busy=false})}
          let pw=null,cur=null,quitting=false
          const PH='<!doctype html><meta charset=utf-8><style>body{margin:0;background:#0a0a09;color:#eee;font:13px system-ui;padding:14px}h1{font-size:16px;margin:0 0 12px}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}button{background:#17171a;border:2px solid #2a2a30;border-radius:10px;color:#eee;padding:8px;cursor:pointer;text-align:left}button:hover{border-color:#8a8aa0}img{width:100%;border-radius:6px;display:block;margin-bottom:6px}span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style><h1>Choose what to share</h1><div id=g></div><script>pickApi.onSources(l=>{const g=document.getElementById("g");g.textContent="";l.forEach(s=>{const b=document.createElement("button"),i=document.createElement("img"),n=document.createElement("span");i.src=s.img;n.textContent=s.name;b.append(i,n);b.onclick=()=>pickApi.pick(s.id);g.append(b)})});addEventListener("keydown",e=>{if(e.key==="Escape")pickApi.pick(null)})</script>'
          const fin=id=>{if(!cur)return;const r=cur;cur=null;if(pw&&!pw.isDestroyed())pw.hide();r(id)}
          ipcMain.on('pick-source',(e,id)=>{if(pw&&!pw.isDestroyed()&&e.sender===pw.webContents)fin(id)})
          const mkPicker=()=>{
          if(pw&&!pw.isDestroyed())return pw
          pw=new BrowserWindow({width:760,height:520,parent:win,modal:true,show:false,autoHideMenuBar:true,backgroundColor:'#0a0a09',title:'Choose what to share',webPreferences:{contextIsolation:true,sandbox:true,preload:require('path').join(__dirname,'picker.js')}})
          pw.on('close',e=>{if(!quitting){e.preventDefault();fin(null)}})
          pw.loadURL('data:text/html;charset=utf-8,'+encodeURIComponent(PH))
          return pw
          }
          const pick=sources=>new Promise(res=>{
          if(cur)fin(null)
          const w=mkPicker()
          cur=res
          const send=()=>{w.webContents.send('sources',sources.map(x=>({id:x.id,name:x.name,img:x.thumbnail.toDataURL()})));w.show()}
          if(w.webContents.isLoading())w.webContents.once('did-finish-load',send)
          else send()
          })
          function updates(){
          autoUpdater.autoDownload=true
          autoUpdater.autoInstallOnAppQuit=true
          autoUpdater.allowDowngrade=false
          autoUpdater.setFeedURL({provider:'generic',url:'__FEED__'})
          let manual=false,shownErr=false
          autoUpdater.on('update-downloaded',()=>{
          dialog.showMessageBox(win,{type:'info',buttons:['Restart now','Later'],defaultId:0,title:'Parley update',message:'A new version of the Parley app is ready.',detail:'Restart to finish updating. The site itself is always up to date.'}).then(r=>{if(r.response===0)autoUpdater.quitAndInstall(false,true)})
          })
          autoUpdater.on('update-available',()=>{manual=true})
          autoUpdater.on('error',e=>{
          if(manual&&!shownErr){shownErr=true;dialog.showMessageBox(win,{type:'warning',buttons:['Open download page','Dismiss'],defaultId:0,title:'Parley update',message:'The automatic update could not finish.',detail:'Download the newest app and replace the old file.'}).then(r=>{if(r.response===0)shell.openExternal('__FEED__/'+(process.platform==='linux'?'Parley.AppImage':'Parley-Setup.exe'))})}
          })
          let lastCheck=0
          const check=()=>{lastCheck=Date.now();return autoUpdater.checkForUpdates().catch(()=>{})}
          setTimeout(check,5000)
          setInterval(check,3600*1000)
          app.on('browser-window-focus',()=>{if(Date.now()-lastCheck>1800*1000)check();refresh()})
          }
          const lock=app.requestSingleInstanceLock()
          if(!lock)app.quit()
          app.on('second-instance',()=>{if(win){if(win.isMinimized())win.restore();win.focus()}})
          app.whenReady().then(()=>{
          session.defaultSession.setPermissionRequestHandler((wc,perm,cb)=>cb(['media','notifications','display-capture','fullscreen','clipboard-sanitized-write'].includes(perm)&&new URL(wc.getURL()).origin===new URL(SITE).origin))
          session.defaultSession.setPermissionCheckHandler((wc,perm,origin)=>origin.startsWith(SITE)&&['media','display-capture','notifications','fullscreen','clipboard-sanitized-write'].includes(perm))
          session.defaultSession.setDisplayMediaRequestHandler(async(req,cb)=>{
          try{
          let src=cache.length&&Date.now()-cacheAt<30000?cache:await grab()
          refresh()
          if(!src.length)return cb({})
          const id=await pick(src)
          const s=src.find(x=>x.id===id)
          if(!s)return cb({})
          const r={video:s}
          if(req.audioRequested&&process.platform==='win32')r.audio='loopback'
          cb(r)
          }catch{cb({})}
          })
          win=new BrowserWindow({width:1280,height:800,backgroundColor:'#050505',autoHideMenuBar:true,icon:require('path').join(__dirname,'build','icon.png'),webPreferences:{contextIsolation:true,sandbox:true}})
          win.webContents.setUserAgent(win.webContents.getUserAgent()+' ParleyDesktop/2')
          win.loadURL(SITE)
          win.webContents.once('did-finish-load',()=>setTimeout(()=>{refresh();mkPicker()},1500))
          win.on('close',()=>{quitting=true})
          win.webContents.setWindowOpenHandler(({url})=>{shell.openExternal(url);return{action:'deny'}})
          if(app.isPackaged&&process.platform!=='darwin')updates()
          })
          app.on('window-all-closed',()=>app.quit())
          EOF
          sed -i.bak "s#__SITE__#${SITE}#g;s#__FEED__#${FEED}#g" main.js
          rm main.js.bak
          npm i --save electron-updater@6
          npm i --save-dev electron@33 electron-builder@25
          npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            desktop/dist/Parley-Setup.exe
            desktop/dist/Parley-Portable.exe
            desktop/dist/Parley-Setup.exe.blockmap
            desktop/dist/Parley.AppImage
            desktop/dist/Parley.deb
            desktop/dist/Parley.dmg
            desktop/dist/Parley.zip
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: |
          mkdir cap && cd cap
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<!doctype html><title>Parley</title>' > www/index.html
          cat > capacitor.config.json <<EOF
          {"appId":"app.parley.android","appName":"Parley","webDir":"www","server":{"url":"${SITE}","androidScheme":"https"}}
          EOF
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' android/app/src/main/AndroidManifest.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; mkdir -p android/app/src/main/res/mipmap-$n; for f in ic_launcher ic_launcher_round ic_launcher_foreground; do convert ../public/logo-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png; done; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Parley.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Parley.apk
  ubuntutouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - shell: bash
        run: |
          mkdir -p ut/c ut/d
          convert public/logo-512.png -resize 256x256 ut/d/icon.png
          cat > ut/d/parley.desktop <<EOF
          [Desktop Entry]
          Name=Parley
          Comment=Chat, call and hang out
          Exec=webapp-container --webapp --enable-back-forward --store-session-cookies --enable-media-hub-audio %u ${SITE}/?web=1
          Icon=icon.png
          Terminal=false
          Type=Application
          X-Ubuntu-Touch=true
          EOF
          cat > ut/d/parley.apparmor <<EOF
          {"template":"ubuntu-webapp","policy_groups":["networking","webview","audio","video","camera","microphone","content_exchange","content_exchange_source","keep-display-on"],"policy_version":16.04}
          EOF
          sed -i 's/^ *//' ut/d/parley.desktop
          cat > ut/c/manifest.json <<EOF
          {"name":"parley.parleyofficial","title":"Parley","version":"1.${{ github.run_number }}.0","description":"Chat, call and hang out","maintainer":"Parley <parley@example.com>","framework":"ubuntu-sdk-16.04","architecture":"all","hooks":{"parley":{"apparmor":"parley.apparmor","desktop":"parley.desktop"}}}
          EOF
          cat > ut/c/control <<EOF
          Package: parley.parleyofficial
          Version: 1.${{ github.run_number }}.0
          Click-Version: 0.4
          Architecture: all
          Maintainer: Parley <parley@example.com>
          Installed-Size: 300
          Description: Parley
          EOF
          sed -i 's/^ *//' ut/c/control
          (cd ut/d && find . -type f -exec md5sum {} + | sed 's# \./# #') > ut/c/md5sums
          (cd ut/c && tar --owner=0 --group=0 -czf ../control.tar.gz ./control ./manifest.json ./md5sums)
          (cd ut/d && tar --owner=0 --group=0 -czf ../data.tar.gz .)
          printf '2.0\n' > ut/debian-binary
          printf '0.4\n' > ut/_click-binary
          cd ut && ar rc Parley.click debian-binary _click-binary control.tar.gz data.tar.gz
          ls -l Parley.click
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntutouch
          path: ut/Parley.click
          if-no-files-found: error
  publish:
    needs: [desktop, android, ubuntutouch]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R out
          gh release create apps --repo "$GITHUB_REPOSITORY" --title "Parley apps" --notes "Parley apps for Windows (installer and portable), Mac, Linux (AppImage, deb), Android and Ubuntu Touch. The desktop apps check this release for updates. The Android file is debug-signed for sideloading. The Mac app is unsigned: right-click it and choose Open the first time." || true
          ls out/*.yml && gh release upload apps out/* --clobber --repo "$GITHUB_REPOSITORY"
