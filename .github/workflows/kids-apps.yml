name: Build kids apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kids-apps.yml'
env:
  SITE: https://parley.heavengtwashere.workers.dev
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          mkdir kd && cd kd && mkdir build
          cp ../public/logo-512.png build/icon.png
          cat > package.json <<EOF
          {"name":"parley-kids","version":"1.${{ github.run_number }}.0","description":"Parley Kids","author":"Parley <parley@example.com>","homepage":"${SITE}/kids/","main":"main.js","build":{"appId":"app.parley.kids","productName":"Parley Kids","directories":{"buildResources":"build"},"files":["main.js","package.json"],"win":{"target":["nsis"],"icon":"build/icon.png"},"nsis":{"oneClick":true,"perMachine":false,"runAfterFinish":true,"artifactName":"ParleyKids-Setup.exe"}}}
          EOF
          cat > main.js <<'EOF'
          const{app,BrowserWindow,shell,session}=require('electron')
          const SITE='__SITE__'
          if(!app.requestSingleInstanceLock())app.quit()
          app.whenReady().then(()=>{
          session.defaultSession.setPermissionRequestHandler((wc,p,cb)=>cb(false))
          session.defaultSession.setPermissionCheckHandler(()=>false)
          const w=new BrowserWindow({width:1000,height:760,backgroundColor:'#dff3ff',autoHideMenuBar:true,icon:require('path').join(__dirname,'build','icon.png'),webPreferences:{contextIsolation:true,sandbox:true}})
          w.loadURL(SITE+'/kids/')
          w.webContents.on('will-navigate',(e,u)=>{if(!u.startsWith(SITE+'/kids/')){e.preventDefault()}})
          w.webContents.setWindowOpenHandler(()=>({action:'deny'}))
          })
          app.on('window-all-closed',()=>app.quit())
          EOF
          sed -i "s#__SITE__#${SITE}#g" main.js
          npm i --save-dev electron@33 electron-builder@25
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kwin
          path: kd/dist/ParleyKids-Setup.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: |
          mkdir cap && cd cap
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<!doctype html><title>Parley Kids</title>' > www/index.html
          cat > capacitor.config.json <<EOF
          {"appId":"app.parley.kids","appName":"Parley Kids","webDir":"www","server":{"url":"${SITE}/kids/","androidScheme":"https","allowNavigation":[]}}
          EOF
          npx cap add android
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; mkdir -p android/app/src/main/res/mipmap-$n; for f in ic_launcher ic_launcher_round ic_launcher_foreground; do convert ../public/logo-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png; done; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../ParleyKids.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kandroid
          path: ParleyKids.apk
          if-no-files-found: error
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kids --repo "$GITHUB_REPOSITORY" --title "Parley Kids apps" --notes "Parley Kids for Windows and Android." 2>/dev/null || true
          gh release upload kids out/* --clobber --repo "$GITHUB_REPOSITORY"
